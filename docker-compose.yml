

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botcoin_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - botcoin
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: botcoin_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - botcoin
    depends_on:
      - app

  db:
    image: mariadb:10.4
    container_name: botcoin_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: volta
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - botcoin_db_data:/var/lib/mysql
    networks:
      - botcoin

networks:
  botcoin:
    driver: bridge

volumes:
  botcoin_db_data: