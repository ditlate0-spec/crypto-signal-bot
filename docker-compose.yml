version: '3.8'

services:
  # ============================================
  # PHP + Apache + Python (всё в одном)
  # ============================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crypto_web
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - mysql
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASSWORD=
      - DB_NAME=volta
    networks:
      - crypto_net

  # ============================================
  # MySQL
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: crypto_mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: volta
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - crypto_net

volumes:
  mysql_data:

networks:
  crypto_net:
    driver: bridge