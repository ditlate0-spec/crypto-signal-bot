services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: botcoin_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - botcoin
    environment:
      EXECUTOR_URL: http://executor:8080
    depends_on:
      db:
        condition: service_healthy
      executor:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: botcoin_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - botcoin
    depends_on:
      - app

  db:
    image: mariadb:10.4
    container_name: botcoin_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: volta
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3307:3306"
    volumes:
      - botcoin_db_data:/var/lib/mysql
    networks:
      - botcoin
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    container_name: botcoin_executor
    restart: unless-stopped
    env_file:
      - .env
    networks:
      - botcoin
    healthcheck:
      test: ["CMD", "/app/executor", "health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    # Порты наружу НЕ публикуем — Rust доступен только внутри сети botcoin
    # Для отладки с хоста раскомментируй:
    ports:
     - "8080:8080"

networks:
  botcoin:
    driver: bridge

volumes:
  botcoin_db_data: